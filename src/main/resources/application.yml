spring:
  application:
    name: darmoz-mail
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:darmoz_mail}
    username: ${DB_USER:darmoz_mail}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    table: mail_flyway_schema_history
    baseline-on-migrate: true
    baseline-version: 0
    placeholder-replacement: false
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:darmozcs@gmail.com}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true

server:
  port: ${APP_PORT:8080}
  servlet:
    context-path: ${DARMOZ_MAIL_PATH_PREFIX:/darmoz-mail}

darmoz:
  mail:
    from-address: ${MAIL_FROM_ADDRESS:darmozcs@gmail.com}
    from-name: ${MAIL_FROM_NAME:Darmoz}
    scheduler:
      fixed-delay-ms: ${MAIL_SCHEDULER_DELAY_MS:30000}
      batch-size: ${MAIL_SCHEDULER_BATCH_SIZE:50}
      max-attempts: ${MAIL_SCHEDULER_MAX_ATTEMPTS:3}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
